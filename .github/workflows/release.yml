name: Release

# 无 Apple 开发者账号版本：ad-hoc 签名，不做公证。
# 产物：Z-island-<version>.dmg，直接挂到 GitHub Release。
#
# 触发方式：推送 v* 形式的 tag（例如 git push origin v1.0.0），
# 或手动 workflow_dispatch（用仓库里最新的 tag 作为版本号）。
# 推 main 不会再发版 —— 那是 CI 的活。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT: Z-island.xcodeproj
  SCHEME: Z-island
  APP_NAME: Z-island

jobs:
  release:
    name: Build & Release (ad-hoc)
    runs-on: macos-26
    timeout-minutes: 45

    # 跳过由工作流自己产生的提交，避免死循环
    if: >-
      !contains(github.event.head_commit.message, 'ci: update appcast') &&
      !contains(github.event.head_commit.message, 'ci: archive changelog')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 版本号：VERSION 为 base，stable tag 已存在则 patch 顺延 ──
      - name: Compute Version
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list HEAD --count)

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # 手动触发：用最近一个 tag 当版本号
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
            if [ -z "$VERSION" ]; then
              VERSION=$(cat VERSION | tr -d '[:space:]')
            fi
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::版本号不合法：'$VERSION'（tag 应形如 v1.0.0）"
            exit 1
          fi

          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"            >> "$GITHUB_OUTPUT"
          echo "dmg_name=${APP_NAME}-${VERSION}.dmg" >> "$GITHUB_OUTPUT"
          echo "📦 ${VERSION} (build ${BUILD_NUMBER})"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      # ── 不签名构建（arm64 链接器会自动给 Mach-O 打 ad-hoc 签名）──
      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}"

      # ── 整个 bundle 做 ad-hoc 签名 ──
      - name: Sign Ad-hoc
        run: |
          APP="build/dd/Build/Products/Release/${APP_NAME}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到产物 $APP"
            find build/dd/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ $(codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature')"

      - name: Extract Release Notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\["v"\\]" {f=1; next}
            /^## \[/ {if(f) exit}
            f {print}
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            LAST_TAG=$(git tag --sort=-creatordate | head -1)
            COMMITS=$(git log --oneline "${LAST_TAG}..HEAD" | head -30)
            NOTES=$(printf "### Commits since last release\n\`\`\`\n%s\n\`\`\`" "$COMMITS")
          fi
          printf "%s\n\n---\n\n> 未签名（ad-hoc）构建，首次打开需右键 → 打开，或执行\n> \`xattr -dr com.apple.quarantine /Applications/%s.app\`\n" \
            "$NOTES" "${APP_NAME}" > build/release_notes.md
          cat build/release_notes.md

      - name: Create DMG
        run: |
          APP="build/dd/Build/Products/Release/${APP_NAME}.app"
          DMG="build/${{ steps.version.outputs.dmg_name }}"
          hdiutil create -volname "${APP_NAME}" -srcfolder "$APP" -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      # ── Sparkle：给 dmg 做 EdDSA 签名并写入 appcast ──
      - name: Sign DMG & Update Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::未配置 SPARKLE_ED_PRIVATE_KEY，跳过 appcast 更新（自动更新不会生效）"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p ~/private_keys
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > ~/private_keys/sparkle_ed.key
          swift scripts/sparkle_tool.swift update \
            --appcast Updates/appcast.xml \
            --dmg "build/${{ steps.version.outputs.dmg_name }}" \
            --version "$VERSION" \
            --build "${{ steps.version.outputs.build_number }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${{ steps.version.outputs.dmg_name }}" \
            --key-file ~/private_keys/sparkle_ed.key \
            --min-system 15.0 \
            --notes-file build/release_notes.md
          rm -f ~/private_keys/sparkle_ed.key

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DMG="build/${{ steps.version.outputs.dmg_name }}"

          # tag 是这次运行的触发者，不需要再建/再推
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，替换资产与说明"
            gh release upload "$TAG" "$DMG" --clobber
            gh release edit "$TAG" \
              --title "${APP_NAME} ${{ steps.version.outputs.version }}" \
              --notes-file build/release_notes.md
          else
            gh release create "$TAG" \
              --title "${APP_NAME} ${{ steps.version.outputs.version }}" \
              --notes-file build/release_notes.md \
              "$DMG"
          fi

      # ── 把更新后的 appcast 推回仓库，app 下次就能读到 ──
      - name: Commit Appcast
        if: ${{ hashFiles('Updates/appcast.xml') != '' }}
        run: |
          if git diff --quiet -- Updates/; then
            echo "appcast 无变化，跳过"
            exit 0
          fi
          git add Updates/
          git commit -m "ci: update appcast for ${{ steps.version.outputs.version }} [skip ci]"
          git push origin "HEAD:main"
